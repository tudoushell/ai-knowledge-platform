server:
  # HTTP 服务监听端口。
  port: 8090
  servlet:
    encoding:
      # 统一请求和响应的字符编码，避免中文乱码。
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # Tomcat URI 使用 UTF-8 编码解析。
    uri-encoding: UTF-8

spring:
  application:
    # Spring Boot 应用名称，也用于日志和注册信息标识。
    name: ai-knowledge-platform
  mvc:
    # 允许 RAG SSE 长连接在模型生成期间保持打开。
    async:
      request-timeout: 5m
  datasource:
    # PostgreSQL 数据库连接地址；生产环境建议通过环境变量注入。
    url: jdbc:postgresql://localhost:5432/ai_db
    # 数据库登录账号。
    username: postgres
    # 数据库登录密码；生产环境不要将真实密码提交到代码仓库。
    password: postgres
    driver-class-name: org.postgresql.Driver
  ai:
    chat:
      client:
        # 当前服务不使用 Spring AI ChatClient 自动配置。
        enabled: false
    model:
      # 禁用未使用的模型自动配置，避免应用启动时创建不必要的模型客户端。
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    vectorstore:
      pgvector:
        # 应用启动时自动创建 pgvector 所需的扩展、表和索引；生产环境建议改用 Flyway/Liquibase 管理。
        initialize-schema: true
        # 向量索引类型：HNSW 查询速度快、召回率高，适合以检索为主的 RAG 场景。
        index-type: HNSW
        # 向量相似度度量：余弦距离侧重比较文本向量的语义方向，距离越小表示越相似。
        distance-type: COSINE_DISTANCE
        # 向量维度，必须与 Embedding 模型的输出维度一致；nomic-embed-text 输出 768 维。
        dimensions: 768
  flyway:
    # 是否启用数据库版本迁移。
    enable: true
    # Flyway SQL 迁移脚本所在目录。
    locations: classpath:db/migration
    # 迁移脚本的字符编码。
    encoding: utf-8
  servlet:
    multipart:
      # 文件上传限制：当前接口一次仅接收一个文档。
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
  type-handlers-package: com.elliot.ai.rag.typerhandler

# OpenAPI 文档：启动后访问 http://localhost:8090/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    # 原始上传文件保存目录。
    root-directory: ./data/uploads
    # 文件解析后的中间结果保存目录。
    parsed-directory: ./data/parsed
  rag:
    chunk:
      # 文档切分后单个 Chunk 的目标最大字符数。
      chunk-size: 500
      # 读取文件时使用的字符缓冲区大小。
      read-buffer-chars: 10000
      # Chunk 批量写入数据库时的批次大小。
      database-batch-size: 100
      # 小于该字符数的片段通常会被过滤或与相邻内容合并。
      min-chunk-chars: 50
      # 相邻 Chunk 的重叠字符数，用于减少切分边界造成的上下文丢失。
      overlap: 0
    retrieval:
      # RAG 最终使用的候选数量；向量和关键词两路的召回数量由 recall-top-k 控制。
      top-k: 5
      # Hybrid 检索中向量和关键词两路各自召回的候选数量，融合后再截取最终 top-k。
      recall-top-k: 20
      # RRF 后送给 Reranker 的候选数量
      rerank-candidate-top-k: 10
      # 向量检索的最低相似度阈值，低于该值的候选会被过滤。
      similarity-threshold: 0.5
      # RRF 的排名平滑常数，值越大，排名差异对融合分数的影响越平缓。
      rrf-k: 60
      # 发送给大模型的检索上下文最大字符数。
      max-context-chars: 20000
      # 命中 Chunk 前后各扩展几个 Chunk。
      adjacent-chunk-radius: 1
      # 单个引用来源允许占用的最大字符数。
      max-source-chars: 8000
    rerank:
      enabled: true
      fallback-enabled: true
      # Rerank 服务地址
      baseUrl: ${RERANK_BASE_URL:https://api.cohere.com}
      #  Rerank API path
      path: ${RERANK_PATH:/v2/rerank}
      #Rerank 模型名称
      model: ${RERANK_MODEL:rerank-v4.0-pro}
      #API Key
      api-key: ${RERANK_API_KEY:}
      connect-timeout: 1s
      read-timeout: 3s

  document:
    task:
      # 文档处理任务线程池的核心线程数。
      core-pool-size: 2
      # 文档处理任务线程池允许创建的最大线程数。
      max-pool-size: 4
      # 等待处理任务的队列容量，队列满后通常会触发拒绝策略。
      queue-capacity: 100
      claim:
        # 单次从数据库领取的待处理任务数量。
        size: 4
      # 任务调度器轮询数据库的间隔，单位为毫秒。
      dispatch-delay-ms: 2000
      # 首次失败重试前的基础等待时间，单位为秒。
      retry-base-seconds: 10
      # 任务超过该时间仍处于处理中时，允许被识别为 stale，单位为分钟。
      stale-minutes: 60
      # 单个文档任务允许的最大重试次数。
      max-retries: 3
