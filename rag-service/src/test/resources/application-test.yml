spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  ai:
    chat:
      client:
        enabled: false
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    vectorstore:
      pgvector:
        # 应用启动时不自动创建 pgvector 所需的扩展、表和索引；生产环境建议改用 Flyway/Liquibase 管理。
        initialize-schema: false
        # 向量索引类型：HNSW 查询速度快、召回率高，适合以检索为主的 RAG 场景。
        index-type: HNSW
        # 向量相似度度量：余弦距离侧重比较文本向量的语义方向，距离越小表示越相似。
        distance-type: COSINE_DISTANCE
        # 向量维度，必须与 Embedding 模型的输出维度一致；nomic-embed-text 输出 768 维。
        dimensions: 768
  flyway:
    enable: true
    locations: classpath:db/migration
    encoding: utf-8

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
  type-handlers-package: com.elliot.ai.rag.typehandler

# OpenAPI 文档：启动后访问 http://localhost:8090/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    root-directory: ./data/uploads
    parsed-directory: ./data/parsed
  rag:
    chunk:
      chunk-size: 500
      read-buffer-chars: 10000
      database-batch-size: 100
      min-chunk-chars: 50
      overlap: 0
    retrieval:
      # 最多获取多少个 Chunk
      top-k: 5
      # 最低相似度
      similarity-threshold: 0.5
      # Context 最大字符数
      max-context-chars: 20000
      # 命中 Chunk 前后各扩展几个 Chunk
      adjacent-chunk-radius: 1
      # 单个引用来源允许占用的最大字符数
      max-source-chars: 8000
      recall-top-k: 20
    query-rewrite:
      #是否在知识库检索前使用 LLM 改写用户查询
      enabled: true
      #Query Rewrite 使用的改写模型
      model-code: qwen3.8-flash
